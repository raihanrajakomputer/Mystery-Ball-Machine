<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Ball</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="language-switcher" class="language-switcher">
  <button id="language-toggle" class="language-toggle" type="button" aria-haspopup="true" aria-expanded="false">
    <span id="language-flag">🇮🇩</span>
    <span id="language-label">Indonesia</span>
    <span class="language-chevron">⌄</span>
  </button>
  <div id="language-dropdown" class="language-dropdown">
    <button type="button" class="language-choice" data-language="id">
      <span>🇮🇩</span><span>Indonesia</span>
    </button>
    <button type="button" class="language-choice" data-language="mak">
      <span>🏴</span><span>Makassar</span>
    </button>
  </div>
</div>

<section id="login-page" class="page active">
  <div class="login-card">
    <div class="eyebrow" data-i18n="login.eyebrow">★ MESIN MISTERI ★</div>
    <h1>MYSTERY<br><span>BALL</span></h1>
    <p class="tagline" data-i18n="login.tagline"></p>
    <p class="login-question" data-i18n="login.question"></p>
    <input id="name-input" type="text" maxlength="18" autocomplete="off" data-i18n-placeholder="login.placeholder">
    <button id="login-btn" class="primary-btn" data-i18n="login.button"></button>
    <p class="tiny" data-i18n="login.tiny"></p>
  </div>
</section>

<section id="game-page" class="page">
  <header class="topbar">
    <div class="brand">MYSTERY<span>BALL</span></div>
    <div class="player">
      <div class="player-name-wrap">
        <span id="player-name">PLAYER</span>
        <button id="rename-btn" class="rename-btn" type="button">✎ <span data-i18n="rename.open"></span></button>
      </div>
      <div class="points-badge">● <strong id="points">1000</strong> <span data-i18n="points"></span></div>
      <button id="earn-btn" class="rename-btn earn-open" type="button" data-i18n="earn.open"></button>
    </div>
  </header>

  <button id="book-btn" class="book-tab" data-i18n-aria="book.open">
    <span class="book-icon">▤</span><span class="book-word" data-i18n="book.word"></span>
  </button>

  <main class="game-layout">
    <div class="intro">
      <p class="eyebrow" data-i18n="intro.eyebrow"></p>
      <h2 data-i18n-html="intro.title"></h2>
      <div class="hint" data-i18n="intro.hint"></div>
    </div>

    <div class="machine-wrap">
      <div class="machine">
        <div class="machine-sign">MYSTERY<br><small>BALL</small></div>
        <div class="machine-glass">
          <div class="shine"></div>
          <div class="balls">
            <div class="ball common"></div><div class="ball uncommon"></div>
            <div class="ball rare small"></div><div class="ball epic small"></div>
            <div class="ball legendary"></div><div class="ball uncommon small"></div>
            <div class="ball rare"></div>
          </div>
          <div class="cartoon-face"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div>
        </div>
        <div class="machine-body">
          <div class="machine-label" data-i18n="machine.label"></div>
          <button id="spin-btn" class="spin-btn"><span class="spin-text" data-i18n="spin"></span> <span>↻</span></button>
          <div class="dispense" id="dispense">?</div>
        </div>
        <div class="machine-base"></div>
      </div>
    </div>

    <section class="result-card">
      <span class="result-label" data-i18n="result.label"></span>
      <div id="result-ball" class="mini-ball result-ball common"><span class="face-eye left"></span><span class="face-eye right"></span><span class="face-mouth"></span></div>
      <span id="result-rarity" class="rarity-chip common-chip" hidden></span>
      <h3 id="result-title"></h3>
      <p id="result-message"></p>
    </section>

    <section class="collection-strip">
      <div class="section-heading">
        <div><p class="eyebrow" data-i18n="collection.eyebrow"></p><h2 data-i18n="collection.title"></h2></div>
        <span id="collection-count">0 / 10</span>
      </div>
      <div id="collection-preview" class="collection-preview"></div>
    </section>
  </main>
</section>

<div id="book-overlay" class="drawer-overlay" aria-hidden="true">
  <aside class="book-drawer" data-i18n-aria="book.aria">
    <div class="book-header">
      <div><p class="eyebrow" data-i18n="book.eyebrow"></p><h2 data-i18n="book.title"></h2></div>
      <button id="close-book" class="close-book" data-i18n-aria="close">×</button>
    </div>
    <div class="book-progress">
      <div class="book-progress-head"><span data-i18n="book.progress"></span><strong id="book-count">0 / 10</strong></div>
      <div class="progress-bar"><span id="book-progress"></span></div>
    </div>
    <div id="rarity-guide" class="rarity-guide"></div>
    <div id="book-grid" class="book-grid"></div>
  </aside>
</div>

<div id="reward-overlay" class="modal-overlay" aria-hidden="true">
  <div class="reward-modal" role="dialog" aria-modal="true">
    <button id="close-reward" class="close-modal" data-i18n-aria="close">×</button>
    <div class="reward-ball">+</div>
    <p class="eyebrow" data-i18n="reward.eyebrow"></p>
    <h2 data-i18n="reward.title"></h2>
    <p data-i18n-html="reward.text"></p>
    <div class="reward-actions">
      <button id="tiktok-btn" class="tiktok-btn" data-i18n="reward.tiktok"></button>
      <button id="claim-btn" class="claim-btn"></button>
    </div>
    <p class="modal-note" data-i18n="reward.note"></p>
  </div>
</div>

<div id="earn-overlay" class="modal-overlay" aria-hidden="true">
  <div class="reward-modal earn-modal" role="dialog" aria-modal="true" aria-labelledby="earn-title">
    <button id="close-earn" class="close-modal" data-i18n-aria="close">×</button>
    <p class="eyebrow" data-i18n="earn.eyebrow"></p>
    <h2 id="earn-title" data-i18n="earn.title"></h2>

    <div id="earn-menu" class="earn-view">
      <button id="earn-opt-daily" class="earn-option" type="button"><span class="earn-num">1</span><span class="earn-text"><strong data-i18n="earn.opt.daily.name"></strong><small data-i18n="earn.opt.daily.desc"></small><em id="earn-status-daily"></em></span></button>
      <button id="earn-opt-math" class="earn-option" type="button"><span class="earn-num">2</span><span class="earn-text"><strong data-i18n="earn.opt.math.name"></strong><small data-i18n="earn.opt.math.desc"></small><em id="earn-status-math"></em></span></button>
      <button id="earn-opt-guess" class="earn-option" type="button"><span class="earn-num">3</span><span class="earn-text"><strong data-i18n="earn.opt.guess.name"></strong><small data-i18n="earn.opt.guess.desc"></small><em id="earn-status-guess"></em></span></button>
      <button id="earn-opt-tiktok" class="earn-option" type="button"><span class="earn-num">★</span><span class="earn-text"><strong data-i18n="earn.opt.tiktok.name"></strong><small data-i18n="earn.opt.tiktok.desc"></small><em id="earn-status-tiktok"></em></span></button>
    </div>

    <div id="earn-daily" class="earn-view" hidden>
      <p class="earn-info" data-i18n="earn.daily.info"></p>
      <button id="earn-daily-claim" class="claim-btn" type="button"></button>
      <button id="earn-back-daily" class="earn-back" type="button" data-i18n="earn.back"></button>
    </div>

    <div id="earn-math" class="earn-view" hidden>
      <p class="earn-info" data-i18n="earn.math.prompt"></p>
      <div id="earn-math-question" class="earn-question"></div>
      <input id="earn-math-input" class="earn-input" type="text" inputmode="numeric" autocomplete="off" data-i18n-placeholder="earn.math.placeholder">
      <p id="earn-math-feedback" class="earn-feedback" role="status" hidden></p>
      <button id="earn-math-submit" class="claim-btn" type="button" data-i18n="earn.math.submit"></button>
      <p id="earn-math-left" class="earn-meta"></p>
      <button id="earn-back-math" class="earn-back" type="button" data-i18n="earn.back"></button>
    </div>

    <div id="earn-guess" class="earn-view" hidden>
      <div class="earn-question" data-i18n="earn.guess.question"></div>
      <input id="earn-guess-input" class="earn-input" type="text" maxlength="40" autocomplete="off" data-i18n-placeholder="earn.guess.placeholder">
      <p id="earn-guess-feedback" class="earn-feedback" role="status" hidden></p>
      <button id="earn-guess-submit" class="claim-btn" type="button" data-i18n="earn.guess.submit"></button>
      <p class="earn-meta" data-i18n="earn.guess.hint"></p>
      <button id="earn-back-guess" class="earn-back" type="button" data-i18n="earn.back"></button>
    </div>
  </div>
</div>

<div id="rename-overlay" class="modal-overlay" aria-hidden="true">
  <div class="reward-modal" role="dialog" aria-modal="true" aria-labelledby="rename-title">
    <button id="close-rename" class="close-modal" data-i18n-aria="close">×</button>
    <div class="reward-ball">✎</div>
    <p class="eyebrow" data-i18n="rename.eyebrow"></p>
    <h2 id="rename-title" data-i18n="rename.title"></h2>
    <p data-i18n="rename.text"></p>
    <input id="rename-input" type="text" maxlength="18" autocomplete="off" data-i18n-placeholder="rename.placeholder">
    <p id="rename-error" class="form-error" role="alert" hidden></p>
    <div class="reward-actions">
      <button id="rename-submit" class="claim-btn" data-i18n="rename.save"></button>
    </div>
    <p class="modal-note" data-i18n="rename.note"></p>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
